# ==============================================================================
# MessMeals Automated Wildcard Subdomain & Storefront Nginx Configuration
# File: /etc/nginx/sites-available/messmeals-wildcard.conf
#
# Architecture:
# - Serves all restaurant storefronts: https://<restaurant-slug>.messmeals.com
# - Single wildcard configuration handles all current and future restaurants.
# - Zero per-restaurant Nginx changes or reloads required.
# - Routes reverse proxy traffic to MessMeals Backend (Port 3011) preserving Host.
# ==============================================================================

# 1. HTTP -> HTTPS Global Redirect (apex domain + all subdomains)
server {
    listen 80;
    listen [::]:80;
    server_name messmeals.com *.messmeals.com;

    # Let's Encrypt ACME HTTP challenge fallback (if HTTP-01 is used for apex)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS with original host preserved
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Platform & Wildcard Subdomain Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name messmeals.com *.messmeals.com;

    # Wildcard SSL Certificates (issued via Let's Encrypt DNS-01 challenge)
    ssl_certificate     /etc/letsencrypt/live/messmeals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messmeals.com/privkey.pem;

    # Recommended Modern SSL Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload size (for menu images, logos, covers)
    client_max_body_size 25M;

    # Proxy buffer settings
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;

    # Root proxy location -> NestJS Backend application on port 3011
    location / {
        proxy_pass http://127.0.0.1:3011;

        # CRITICAL: Preserve incoming Host header so NestJS hostname resolver identifies the restaurant
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;

        # WebSocket & Long Polling support (for generation status)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # Static assets caching (if served directly or uploaded)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3011/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

